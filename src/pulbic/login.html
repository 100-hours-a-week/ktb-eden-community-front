<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | 아무 말 대잔치</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/login-style.css" />
</head>
<body>
  <header>
    <h1>비 회원으로 보기</h1>
  </header>

  <main class="login-container">
    <label for="login-Title" class="login-Title">로그인</label>
    <div class="login-box">
      <div class="input-group">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="이메일을 입력하세요" />
      </div>

      <div class="input-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호를 입력하세요" />
        <small id="helper-text" class="helper-text"></small>
      </div>

      <button id="login-btn" >로그인</button>
      <button id="signup-btn" class="signup-btn">회원가입</button>
    </div>
  </main>
  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
