<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시글 목록 | Eden</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/boardList-style.css" />
</head>
<body>
  <div id="header"></div>
  <main class="board-container">
    
    <div class="top-bar">
      <div class="category-title">
        <h2 id="category-name">📋 전체 게시판</h2>
      </div>

      <div class="search-wrapper">
        <select id="search-filter">
          <option value="제목">제목</option>
          <option value="제작처">작성자</option>
        </select>
        <input type="text" id="search-input" placeholder="검색어를 입력하세요" />
        <button class="search-btn">
          <img src="../assets/search_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg"/>
        </button>
      </div>
      <button class="create-btn">
        <img src="../assets/add_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg"/>
      </button>
    </div>
    <section class="board-list">
    </section>
    <div id="observer"></div>
  </main>
  <div class="pet-container"></div>
  <script type="module" src="../js/pages/boardList.js"></script>
  <script type="module" src="../js/common/headerLoader.js"></script>
</body>
</html>
