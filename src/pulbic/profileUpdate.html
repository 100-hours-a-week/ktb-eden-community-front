<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원정보수정 | 아무 말 대잔치</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/profileUpdate-style.css" />
</head>
<body>
  <div id="header"></div>
  <main class="profile-update-container">
    <h2 class="page-title">회원정보수정</h2>

    <div>
      <label class="profile-label">프로필 사진*</p>
    </div>
    <section class="profile-update-section">
      <div class="profile-image-wrap">
        <img alt="프로필 이미지" id="profile-preview" class="profile-preview" />
        <label for="profile-upload" class="profile-edit-btn">변경</label>
        <input type="file" id="profile-upload" accept="image/*" hidden />
      </div>

      <form class="profile-update-form" id="profile-update-form">
        <div class="input-group">
          <label class="label-text">이메일</label>
          <div class="email-display">startupcode@gmail.com</div>
        </div>

        <div class="input-group">
          <label for="nickname">닉네임</label>
          <input type="text" id="nickname" value="스타트업코드" />
          <small class="helper-text"></small>
        </div>

          <button type="button" id="update-preview" class="preview-btn">수정하기</button>
          <button type="button" id="delete-btn" class="delete-btn">회원 탈퇴</button>

        <button type="submit" id="save-btn" class="save-btn">수정완료</button>
      </form>
    </section>
  </main>

  <div id="modal" class="modal">
    <div class="modal-popup">
        <h3 id="modal-title">정말 삭제하시겠습니까?</h3>
        <p id="modal-desc">삭제한 내용은 복구할 수 없습니다.</p>

        <div class="modal-btn-group">
          <button id="modal-cancel" class="modal-btn cancel">취소</button>
          <button id="modal-confirm" class="modal-btn confirm">확인</button>
        </div>
    </div>
  </div>
  
  <script type="module" src="../js/common/headerLoader.js"></script>
  <script type="module" src="../js/pages/profileUpdate.js"></script>
</body>
</html>
