<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 수정 | 아무 말 대잔치</title>
  <link rel="stylesheet" href="../css/common.css"/>
  <link rel="stylesheet" href="../css/passwordUpadte-style.css" />
</head>
<body>
  <div id="header"></div>

  <main class="passwordUpdate-container">
    <label for="passwordUpdate-Title" class="passwordUpdate-Title">비밀번호 수정</label>
    <div class="passwordUpdate-box">
      <div class="input-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호를 입력하세요" />
        <small id="password-helper" class="helper-text"></small>
      </div>

      <div class="input-group">
        <label for="password-confirm">비밀번호 확인</label>
        <input type="password" id="password-confirm" placeholder="비밀번호를 한번 더 입력하세요" />
        <small id="password-confirm-helper" class="helper-text"></small>
      </div>

      <button id="edit-btn">수정하기</button>
  </main>
  <script type="module" src="../js/common/headerLoader.js"></script>
  <script type="module" src="../js/pages/passwordUpdate.js"></script>
</body>
</html>
