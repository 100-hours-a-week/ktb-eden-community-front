<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시글 작성 | 아무 말 대잔치</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/boardCreate-style.css" />
</head>
<body>
  <div id="header"></div>
  <main class="board-create-container">
    <h2 class="page-title">게시글 수정</h2>

    <form class="board-form" id="board-form">
      <!-- 제목 -->
      <div class="input-group">
        <label for="title">제목*</label>
        <input type="text" id="title" placeholder="제목을 적어주세요" maxlength="20" />
        <small class="helper-text"></small>
      </div>

      <!-- 내용 -->
      <div class="input-group">
        <label for="content">내용*</label>
        <textarea id="content" placeholder="내용을 적어주세요"></textarea>
        <small class="helper-text"></small>
      </div>

      <!-- 이미지 업로드 -->
      <div class="input-group">
        <label for="image">이미지</label>
        <input type="file" id="image" accept="image/*" />
        <img id="image-preview" style="display:none; width:300px; max-height:300px; object-fit:contain; margin-top:10px;" />
      </div>

      <!-- 등록 버튼 -->
      <button type="submit" class="submit-btn">수정하기</button>
    </form>
  </main>
  <script type="module" src="../js/common/headerLoader.js"></script>
  <script type="module" src="../js/pages/boardUpdate.js"></script>
</body>
</html>
